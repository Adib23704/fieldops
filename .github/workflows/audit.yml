name: Dependency Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0" # Weekly scan every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          version: latest
          runtime: node@24
          cache: false
          install: false

      - name: Audit Backend Dependencies (High/Critical)
        run: |
          cd backend
          pnpm audit --audit-level=high

      - name: Audit Frontend Dependencies (High/Critical)
        run: |
          cd frontend
          pnpm audit --audit-level=high
